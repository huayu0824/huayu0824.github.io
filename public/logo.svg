    <rect width="48" height="48" rx="10" fill="#B03A2E"/>
    <g stroke="#FAFAF7" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M18.6 17.4 L29.7 16.4"/>
      <path d="M12.9 23.6 L35.4 22.1"/>
