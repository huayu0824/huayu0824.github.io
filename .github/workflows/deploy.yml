name: Deploy Amytis site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发推送互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 必须和本地验证过的版本一致：bun.lock 由该版本生成，
          # 版本不同会让 --frozen-lockfile 失败
          bun-version: '1.4.3'

      - name: Setup Python (可选，供 rST 渲染使用)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docutils (可选)
        run: |
          python -m pip install --upgrade pip
          python -m pip install docutils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
