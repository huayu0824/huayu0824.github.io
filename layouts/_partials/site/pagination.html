{{- /* 传入 .Paginator */ -}}
{{- $paginator := . -}}
{{- if gt $paginator.TotalPages 1 -}}
    <nav class="sd-pagination" aria-label="分页">
        {{- with $paginator.Prev -}}
            <a class="sd-page-btn" href="{{ .URL }}" rel="prev">← 上一页</a>
        {{- else -}}
            <span class="sd-page-btn is-disabled">← 上一页</span>
        {{- end -}}

        <span class="sd-page-info">{{ $paginator.PageNumber }} / {{ $paginator.TotalPages }}</span>

        {{- with $paginator.Next -}}
            <a class="sd-page-btn" href="{{ .URL }}" rel="next">下一页 →</a>
        {{- else -}}
            <span class="sd-page-btn is-disabled">下一页 →</span>
        {{- end -}}
    </nav>
{{- end -}}
